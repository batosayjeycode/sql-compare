<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL Compare — Diff, format & normalize SQL in your browser</title>

      content="Compare two SQL queries or files side by side. Formatting, structural and potential semantic differences are separated. Runs entirely in your browser."

      <div class="boot" aria-hidden="true">

          <span class="boot-logo"></span>
          <span class="boot-title">SQL Compare</span>

    <script type="module" src="/src/main.tsx"></script>
